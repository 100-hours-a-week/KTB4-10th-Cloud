---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kgb-worker
  namespace: argocd
spec:
  destination:
    namespace: kgb-worker
    server: https://kubernetes.default.svc
  project: default
  source:
    helm:
      releaseName: kgb-worker
      valueFiles:
      - "../../environments/staging/worker.yaml"
    path: helm/worker
    repoURL: ssh://git@ssh.github.com:443/100-hours-a-week/KTB4-10th-Cloud.git
    targetRevision: main
