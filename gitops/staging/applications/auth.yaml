---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth
  namespace: argocd
spec:
  destination:
    namespace: auth
    server: https://kubernetes.default.svc
  project: default
  source:
    path: helm/auth
    repoURL: ssh://git@ssh.github.com:443/100-hours-a-week/KTB4-10th-Cloud.git
    targetRevision: main
    helm:
      valueFiles:
      - "../../environments/staging/auth.yaml"
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: auth
      namespace: auth
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true
    automated:
      enabled: true
      prune: false
      selfHeal: false
