---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tourapi-scheduler
  namespace: argocd
spec:
  destination:
    namespace: kgb-ops
    server: https://kubernetes.default.svc
  project: default
  source:
    path: helm/scheduler
    repoURL: ssh://git@ssh.github.com:443/100-hours-a-week/KTB4-10th-Cloud.git
    targetRevision: main
    helm:
      valueFiles:
      - "../../environments/staging/scheduler.yaml"
