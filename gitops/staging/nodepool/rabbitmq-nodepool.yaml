# RabbitMQ 전용 NodePool
# - taint로 다른 워크로드는 못 들어오게 하고, RabbitMQ는 toleration + nodeAffinity로 이 풀에만 배치
# - 기본 general-purpose 풀은 c/m/r 5세대 이상만 허용해 t3가 안 뜨므로 별도 풀 생성
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: rabbitmq-staging
spec:
  template:
    metadata:
      labels:
        kgb.io/workload: rabbitmq
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: default
      taints:
        - key: kgb.io/workload
          value: rabbitmq
          effect: NoSchedule
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.medium"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
    # 자발적 중단(빈 노드 정리·drift 등)은 동시에 1대까지만 허용. 만료(expireAfter)에는 적용되지 않음
    budgets:
      - nodes: "1"
  limits:
    # t3.medium(2 vCPU) 3대 + 교체 시 임시 1대
    cpu: "8"
