# Shared defaults only. Supply environments/<environment>/scheduler.yaml with -f.
---
replicaCount: 1
strategy:
  type: Recreate
serviceAccount:
  name: tourapi-scheduler
image:
  repository: ghcr.io/100-hours-a-week/ktb4-10-be
  tag: ''
  pullPolicy: IfNotPresent
imagePullSecrets:
- name: ghcr-pull
resources: {}
ports:
  http: 8080
  management: 8081
probes:
  startup:
    httpGet:
      path: "/actuator/health/liveness"
      port: management
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 24
  liveness:
    httpGet:
      path: "/actuator/health/liveness"
      port: management
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
env: {}
envFrom:
- secretRef:
    name: scheduler-backend-env
