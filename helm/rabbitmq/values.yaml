# Shared defaults only. Supply environments/<environment>/rabbitmq.yaml with -f.
---
name: rabbitmq
replicas: 1
image: rabbitmq:4.3.4-management
resources: {}
persistence:
  storageClassName: ''
  storage: 10Gi
service:
  type: ClusterIP
scheduling:
  dedicatedNodePool: {}
  spreadAcrossNodes: false
  spreadAcrossZones: false
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1
additionalConfig: ''
