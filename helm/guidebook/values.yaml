# Shared defaults only. Supply environments/<environment>/guidebook.yaml with -f.
---
replicaCount: 1
image:
  repository: ghcr.io/100-hours-a-week/ktb4-10-be
  tag: ''
  pullPolicy: IfNotPresent
imagePullSecrets:
- name: ghcr-pull
resources: {}
ports:
  http: 8080
  management: 8081
probes:
  startup:
    httpGet:
      path: "/actuator/health/liveness"
      port: management
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 24
  readiness:
    httpGet:
      path: "/actuator/health/readiness"
      port: management
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    httpGet:
      path: "/actuator/health/liveness"
      port: management
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
env: {}
envFrom:
- secretRef:
    name: guidebook-backend-env
ingress:
  enabled: false
  className: ''
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: '8081'
    alb.ingress.kubernetes.io/healthcheck-path: "/actuator/health"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
    alb.ingress.kubernetes.io/success-codes: '200'
  paths:
  - path: "/api/v1/guidebooks"
    pathType: Prefix
  - path: "/api/v1/guidebook-generations"
    pathType: Prefix
  - path: "/api/v1/credits"
    pathType: Prefix
  - path: "/api/v1/events"
    pathType: Prefix
  - path: "/api/v1/notifications"
    pathType: Prefix
  - path: "/api/v1/contents"
    pathType: Prefix
  - path: "/api/v1/map"
    pathType: Prefix
  - path: "/api/v1/push"
    pathType: Prefix
