# Shared defaults only. Supply environments/<environment>/worker.yaml with -f.
---
replicaCount: 1
image:
  repository: ghcr.io/100-hours-a-week/ktb4-10-ai
  tag: ''
  pullPolicy: IfNotPresent
imagePullSecrets:
- name: ghcr-pull
strategy:
  type: Recreate
terminationGracePeriodSeconds: 660
ports:
  http: 8000
resources: {}
env: {}
envFrom:
- secretRef:
    name: worker-env
rabbitmq:
  secretName: worker-env
  secretKey: RABBITMQ_URL
probes:
  startup:
    httpGet:
      path: "/health"
      port: http
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 60
  readiness:
    httpGet:
      path: "/health"
      port: http
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    httpGet:
      path: "/health"
      port: http
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
